<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Your Free Resource</title>
<style>
  /* Reset dasar */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Latar belakang gelap */
  body {
    background-color: #0f0f11;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Container Modal Putih */
  .modal {
    background-color: #ffffff;
    border-radius: 12px;
    padding: 40px 30px;
    width: 90%;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    position: relative;
  }

  /* Ikon Logo (4 Kotak Oranye) */
  .logo-icon {
    display: grid;
    grid-template-columns: 14px 14px;
    gap: 4px;
    justify-content: center;
    margin-bottom: 24px;
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
  }
  .logo-icon div {
    width: 14px;
    height: 14px;
    background-color: #e04a22;
  }
  .logo-icon .circle {
    border-radius: 50%; /* Kotak kanan atas sedikit membulat seperti di gambar */
    background-color: #f06a42;
  }

  /* Judul */
  h1 {
    font-size: 24px;
    color: #111111;
    font-weight: 700;
    margin-bottom: 24px;
    letter-spacing: -0.5px;
  }

  /* Pengaturan Timer */
  .timer-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 20px;
  }
  .time-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 50px;
  }
  .time-num {
    font-family: monospace, sans-serif;
    font-size: 22px;
    font-weight: bold;
    color: #d32f2f; /* Warna merah pada angka */
    letter-spacing: 1px;
  }
  .time-label {
    font-size: 10px;
    color: #888888;
    margin-top: 4px;
    letter-spacing: 1px;
  }
  .colon {
    font-size: 20px;
    font-weight: bold;
    color: #d32f2f;
    margin-top: -2px;
  }

  /* Teks Bawah Timer */
  .expire-text {
    font-size: 13px;
    color: #555555;
    margin-bottom: 28px;
    font-family: monospace, sans-serif;
  }

  /* Grup Tombol */
  .btn-group {
    display: flex;
    gap: 15px;
    justify-content: center;
  }
  .btn {
    flex: 1;
    padding: 14px 10px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    border: none;
  }
  .btn:hover {
    transform: translateY(-2px);
    opacity: 0.9;
  }
  
  /* Warna Tombol */
  .btn-dark {
    background-color: #0b1121;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(11, 17, 33, 0.3);
  }
  .btn-red {
    background-color: #d83b20;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(216, 59, 32, 0.3);
  }

  /* Responsif untuk HP */
  @media (max-width: 480px) {
    .btn-group {
      flex-direction: column;
      gap: 12px;
    }
    .modal {
      padding: 35px 20px 25px;
    }
  }
</style>
</head>
<body>

  <!-- Ikon Logo melayang di luar modal agar mirip desain -->
  <div class="logo-icon">
    <div></div><div class="circle"></div>
    <div></div><div></div>
  </div>

  <div class="modal">
    <h1>Access Your Free Resource</h1>
    
    <div class="timer-container">
      <div class="time-box">
        <span class="time-num" id="tDays">02</span>
        <span class="time-label">DAYS</span>
      </div>
      <span class="colon">:</span>
      <div class="time-box">
        <span class="time-num" id="tHours">23</span>
        <span class="time-label">HOURS</span>
      </div>
      <span class="colon">:</span>
      <div class="time-box">
        <span class="time-num" id="tMins">54</span>
        <span class="time-label">MINUTES</span>
      </div>
      <span class="colon">:</span>
      <div class="time-box">
        <span class="time-num" id="tSecs">56</span>
        <span class="time-label">SECONDS</span>
      </div>
    </div>

    <div class="expire-text">Offer Expire Soon</div>

    <div class="btn-group">
      <a href="#" id="btnContinue" class="btn btn-dark">Continue &rarr;</a>
      <a href="#" id="btnClose" class="btn btn-red">Close</a>
    </div>
  </div>

<script>
// ===== GANTI LINK DI SINI =====
const SMARTLINK = "https://www.profitableratecpmnetwork.com/vk2f6gtdyu?key=01ebcf7b8a6797492aeab131b7168983";
// ==============================

// FUNGSI 1: Memaksa Redirect ke Smartlink untuk KEDUA Tombol
const btnContinue = document.getElementById('btnContinue');
const btnClose = document.getElementById('btnClose');

function forceRedirect(e) {
  e.preventDefault(); // Mencegah reload/macet
  window.location.href = SMARTLINK; // Paksa buka smartlink
}

btnContinue.addEventListener('click', forceRedirect);
btnClose.addEventListener('click', forceRedirect);

// FUNGSI 2: Countdown Timer (2 Hari, 23 Jam, 54 Menit)
// Total detik: (2 * 86400) + (23 * 3600) + (54 * 60) + 56 = 258896 detik
let totalSeconds = 258896;

function pad(n) {
  return String(n).padStart(2, '0');
}

function updateTimer() {
  if (totalSeconds > 0) totalSeconds--;
  
  let d = Math.floor(totalSeconds / 86400);
  let h = Math.floor((totalSeconds % 86400) / 3600);
  let m = Math.floor((totalSeconds % 3600) / 60);
  let s = totalSeconds % 60;
  
  document.getElementById('tDays').textContent = pad(d);
  document.getElementById('tHours').textContent = pad(h);
  document.getElementById('tMins').textContent = pad(m);
  document.getElementById('tSecs').textContent = pad(s);
}

// Jalankan timer
updateTimer();
setInterval(updateTimer, 1000);
</script>
</body>
</html>
